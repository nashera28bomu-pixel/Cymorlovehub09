<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>A Love Experience — Cymor Love Hub</title>
<meta name="description" content="Someone created a cinematic experience just for you."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/experience.css"/>
</head>
<body class="theme-rose">

<div id="loadingScreen" class="loading-screen"><div class="loading-icon">♥</div></div>
<div id="errorScreen" class="error-screen" style="display:none">
  <div class="error-wrap">
    <span class="error-icon">♥</span>
    <h1 id="errorTitle">Experience not found</h1>
    <p id="errorMsg">This experience may have expired or the link may be incorrect.</p>
    <a href="/" class="btn-home">Create Your Own →</a>
  </div>
</div>

<audio id="bgMusic" loop></audio>
<canvas id="particleCanvas"></canvas>
<div id="petalLayer"></div>

<div id="experienceWrapper" style="display:none">

  <!-- INTRO SCENE -->
  <div class="scene" id="scene-intro">
    <div class="intro-stars" id="introStars"></div>
    <div class="intro-glow"></div>
    <div class="intro-name-wrap">
      <p class="intro-for">with love,</p>
      <h1 class="intro-name" id="introName"></h1>
    </div>
    <div class="intro-from" id="introFrom"></div>
    <div class="intro-continue">
      <button class="btn-begin" onclick="beginExperience()">Open Your Experience ♥</button>
    </div>
  </div>

  <!-- MAIN SCENE -->
  <div class="scene" id="scene-main" style="display:none">
    <div class="photo-bg" id="photoBg">
      <div class="photo-slide active" id="photoSlide0"></div>
      <div class="photo-slide" id="photoSlide1"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="experience-scroll" id="experienceScroll">

      <!-- OPENING — always shown -->
      <div class="exp-section section-opening reveal-section">
        <div class="exp-inner" style="text-align:center">
          <span class="opening-ornament" id="openingIcon">✦</span>
          <h1 class="exp-title" id="expTitle"></h1>
          <p class="exp-intro" id="expIntro"></p>
          <!-- scroll nudge to remove dead space feeling -->
          <div class="scroll-nudge" style="margin-top:40px">
            <span>scroll to read</span>
            <div class="scroll-nudge-arrow">↓</div>
          </div>
        </div>
      </div>

      <!-- LETTER / POEM / APOLOGY / PROPOSAL BODY -->
      <div class="exp-section section-letter reveal-section" id="bodySection">
        <div class="exp-inner letter-inner">
          <div class="letter-header"><div class="letter-ornament" id="bodyOrnament">❦</div></div>
          <div class="letter-body" id="letterBody"><span id="typewriterText"></span><span class="cursor" id="twCursor" style="display:none"></span></div>
          <div class="letter-signature" id="letterSignature"></div>
        </div>
      </div>

      <!-- GALLERY — only if photos -->
      <div class="exp-section section-gallery reveal-section" id="gallerySection" style="display:none">
        <div class="exp-inner">
          <h2 class="gallery-title" id="galleryTitle"></h2>
          <p class="gallery-subtitle" id="gallerySubtitle"></p>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </div>

      <!-- POEM LINES — only for poem type -->
      <div class="exp-section reveal-section" id="poemSection" style="display:none">
        <div class="exp-inner" style="text-align:center">
          <div class="poem-lines" id="poemLines"></div>
          <p class="poem-dedication" id="poemDedication"></p>
        </div>
      </div>

      <!-- TIMELINE — only for timeline type -->
      <div class="exp-section reveal-section" id="timelineSection" style="display:none;min-height:auto;padding:60px 24px">
        <div class="exp-inner">
          <div class="timeline-wrap" id="timelineWrap"></div>
        </div>
      </div>

      <!-- QUIZ RESULTS — only for quiz type -->
      <div class="exp-section reveal-section" id="quizSection" style="display:none;min-height:auto;padding:40px 24px">
        <div class="exp-inner">
          <div id="quizResults"></div>
        </div>
      </div>

      <!-- PLAYLIST — only for playlist type -->
      <div class="exp-section reveal-section" id="playlistSection" style="display:none;min-height:auto;padding:40px 24px">
        <div class="exp-inner">
          <div class="playlist-card" id="playlistCard"></div>
        </div>
      </div>

      <!-- QUOTE -->
      <div class="exp-section section-quote reveal-section" id="quoteSection">
        <div class="exp-inner"><blockquote class="exp-quote" id="expQuote"></blockquote></div>
      </div>

      <!-- ENDING -->
      <div class="exp-section section-ending reveal-section">
        <div class="exp-inner">
          <div class="ending-hearts"><span class="ending-heart">♥</span><span class="ending-heart">♥</span><span class="ending-heart">♥</span></div>
          <h2 class="ending-title" id="endingTitle"></h2>
          <p class="ending-message" id="endingMessage"></p>
        </div>
      </div>

      <!-- CTA -->
      <div class="exp-section section-cta" id="section-cta" style="display:none">
        <div class="exp-inner cta-inner" style="text-align:center">
          <p class="exp-cta-text" id="expCta"></p>
          <a href="/" class="btn-create-own">Create Your Own on Cymor Love Hub ♥</a>
          <p class="powered-by" style="margin-top:16px">Made with <span style="color:var(--accent)">♥</span> on Cymor Love Hub</p>
        </div>
      </div>

    </div>

    <!-- REACTION BAR -->
    <div class="reaction-bar" id="reactionBar">
      <button class="reaction-btn" onclick="react('❤️')">❤️</button>
      <button class="reaction-btn" onclick="react('😭')">😭</button>
      <button class="reaction-btn" onclick="react('💕')">💕</button>
      <button class="reaction-btn" onclick="react('✨')">✨</button>
      <button class="reaction-btn" onclick="react('🥺')">🥺</button>
    </div>

    <button class="music-toggle" id="musicToggle" onclick="toggleMusic()">♪</button>
  </div>
</div>

<script src="/js/experience.js"></script>
</body></html>
